name: Correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-ai
      - id: pins
        shell: bash
        run: |
          for pin in BASE LUCE CONFIG HTTP_CLIENT JSON TLS CRYPTO; do
            key=$(printf '%s' "$pin" | tr '[:upper:]' '[:lower:]')
            echo "$key=$(cat luce-ai/bootstrap/$pin)" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce-base, ref: "${{ steps.pins.outputs.base }}", path: luce-base}
      - name: Check out the pinned library packages
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          while read -r name revision; do
            [ -n "$name" ] || continue
            git init -q "$name"
            git -C "$name" fetch -q --depth 1 "https://github.com/dymokomi/$name.git" "$revision"
            git -C "$name" checkout -q --detach FETCH_HEAD
          done < luce-ai/bootstrap/PACKAGES
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce, ref: "${{ steps.pins.outputs.luce }}", path: luce}
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce-config, ref: "${{ steps.pins.outputs.config }}", path: luce-config}
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce-http-client, ref: "${{ steps.pins.outputs.http_client }}", path: luce-http-client}
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce-json, ref: "${{ steps.pins.outputs.json }}", path: luce-json}
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce-tls, ref: "${{ steps.pins.outputs.tls }}", path: luce-tls}
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce-crypto, ref: "${{ steps.pins.outputs.crypto }}", path: luce-crypto}
      - name: Select Clang
        run: |
          mkdir -p "$RUNNER_TEMP/luce-bin"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/luce-bin/cc"
          echo "$RUNNER_TEMP/luce-bin" >> "$GITHUB_PATH"
      - name: Build compilers
        run: |
          (cd luce-base && ./build.sh)
          (cd luce && LUCE_BASE_COMPILER=../luce-base/build/luce-base ./build.sh)
      - run: ./test.sh
        working-directory: luce-ai
